name: Deploy GameHub to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Fetch upstream PokéRogue beta
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pokerogue
          git clone --depth 1 --branch beta --single-branch --recurse-submodules --shallow-submodules https://github.com/pagefaultgames/pokerogue.git /tmp/pokerogue

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.9.0"

      - name: Install PokéRogue dependencies
        working-directory: /tmp/pokerogue
        run: pnpm install --frozen-lockfile

      - name: Build PokéRogue
        working-directory: /tmp/pokerogue
        run: pnpm build

      - name: Assemble GitHub Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='games/pokerouge' ./ _site/
          mkdir -p _site/games/pokerouge
          rsync -a /tmp/pokerogue/dist/ _site/games/pokerouge/

          # PokéRogue keeps runtime sprites/audio/etc. in the assets submodule.
          rsync -a --exclude='.git' /tmp/pokerogue/assets/ _site/games/pokerouge/assets/
          rsync -a --exclude='.git' /tmp/pokerogue/locales/ _site/games/pokerouge/locales/

          # The production HTML/CSS references these files from the game root.
          mkdir -p _site/games/pokerouge/fonts
          rsync -a /tmp/pokerogue/assets/fonts/ _site/games/pokerouge/fonts/
          cp /tmp/pokerogue/assets/logo128.png _site/games/pokerouge/logo128.png
          cp /tmp/pokerogue/assets/logo512.png _site/games/pokerouge/logo512.png
          cp /tmp/pokerogue/assets/manifest.webmanifest _site/games/pokerouge/manifest.webmanifest
          cp /tmp/pokerogue/assets/service-worker.js _site/games/pokerouge/service-worker.js

          # PokéRogue is embedded inside GameHub, so its PWA service worker can
          # otherwise cache an older broken build. Unregister any old worker and
          # clear its caches before the game starts.
          python3 - <<'PY'
from pathlib import Path
p = Path("_site/games/pokerouge/index.html")
s = p.read_text()
marker = "<head>"
patch = """<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", async () => {
    try {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
      if ("caches" in window) {
        const names = await caches.keys();
        await Promise.all(names.map(n => caches.delete(n)));
      }
    } catch (e) {
      console.warn("Service worker cleanup failed:", e);
    }
  });
}
</script>
"""
s = s.replace(marker, marker + "\n" + patch, 1)
p.write_text(s)
PY

          # Phaser normally uses WebGL here. AUTO lets mobile browsers fall
          # back to Canvas if WebGL creation fails.
          python3 - <<'PY'
from pathlib import Path
for p in Path("/tmp/pokerogue").rglob("main.ts"):
    if p.as_posix().endswith("/src/main.ts"):
        s = p.read_text()
        old = "type: Phaser.WEBGL,"
        if old not in s:
            raise SystemExit("Expected Phaser.WEBGL line was not found")
        p.write_text(s.replace(old, "type: Phaser.AUTO,", 1))
        break
else:
    raise SystemExit("PokéRogue src/main.ts not found")

PY

          # Print the final shell and its referenced files so broken relative
          # paths fail the build instead of silently producing a blank iframe.
          test -s _site/games/pokerouge/index.html
          grep -E 'src=|href=' _site/games/pokerouge/index.html || true
          test -f _site/games/pokerouge/logo512.png
          test -f _site/games/pokerouge/manifest.webmanifest
          test -f _site/games/pokerouge/service-worker.js

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
