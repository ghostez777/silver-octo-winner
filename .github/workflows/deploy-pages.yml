name: Deploy GameHub to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Fetch upstream PokéRogue beta
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pokerogue
          git clone --depth 1 --branch beta --single-branch --recurse-submodules --shallow-submodules https://github.com/pagefaultgames/pokerogue.git /tmp/pokerogue

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.9.0"

      - name: Install PokéRogue dependencies
        working-directory: /tmp/pokerogue
        run: pnpm install --frozen-lockfile

      - name: Build PokéRogue
        working-directory: /tmp/pokerogue
        run: pnpm build

      - name: Assemble GitHub Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='games/pokerouge' ./ _site/
          mkdir -p _site/games/pokerouge
          rsync -a /tmp/pokerogue/dist/ _site/games/pokerouge/
          # Runtime sprites, audio, fonts, and locale JSON are separate upstream submodules.
          rsync -a --exclude='.git' /tmp/pokerogue/assets/ _site/games/pokerouge/assets/
          rsync -a --exclude='.git' /tmp/pokerogue/locales/ _site/games/pokerouge/locales/
          # Production CSS references fonts at ./fonts/.
          mkdir -p _site/games/pokerouge/fonts
          rsync -a /tmp/pokerogue/assets/fonts/ _site/games/pokerouge/fonts/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
