<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PokéRogue</title>
  <style>
    html,body{width:100%;height:100%;margin:0;background:#111;overflow:hidden}
    #game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#111}
    #fallback{position:fixed;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);
      max-width:520px;padding:24px;text-align:center;color:#fff;background:rgba(20,20,20,.94);
      border-radius:12px;font:16px system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.45)}
    #fallback a{display:inline-block;margin-top:14px;padding:10px 16px;border-radius:8px;background:#da3838;color:#fff;text-decoration:none;font-weight:700}
    #fallback p{color:#bbb;line-height:1.5}.hidden{display:none!important}
  </style>
</head>
<body>
  <iframe id="game" src="https://pokerogue.net/" title="PokéRogue"
    allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <div id="fallback">
    <strong>PokéRogue is loading…</strong>
    <p>If it does not appear, your browser may block embedded games. Open PokéRogue directly instead.</p>
    <a href="https://pokerogue.net/" target="_blank" rel="noopener noreferrer">Open PokéRogue</a>
  </div>
  <script>
    const frame=document.getElementById("game"), fallback=document.getElementById("fallback");
    frame.addEventListener("load",()=>fallback.classList.add("hidden"));
    setTimeout(()=>fallback.classList.remove("hidden"),5000);
  </script>
</body>
</html>
