<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nonogram</title>
<style>
    body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #0f172a;
        color: #e5e7eb;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
    }
    h1 {
        margin: 20px 0 10px;
    }
    #board {
        display: grid;
        gap: 2px;
        margin-top: 10px;
        touch-action: manipulation;
    }
    .cell {
        width: 32px;
        height: 32px;
        background: #1f2937;
        border-radius: 4px;
        cursor: pointer;
        user-select: none;
    }
    .cell.filled {
        background: #22c55e;
    }
    .cell.marked {
        background: #ef4444;
    }
    #controls {
        margin-top: 10px;
    }
    button {
        padding: 8px 14px;
        border-radius: 6px;
        border: none;
        background: #3b82f6;
        color: white;
        font-size: 14px;
        cursor: pointer;
    }
    button:hover {
        background: #2563eb;
    }
</style>
</head>
<body>

<h1>Nonogram</h1>
<div id="controls">
    <button id="resetBtn">Clear</button>
</div>
<div id="board"></div>

<script>
const size = 10;
let board = [];

function createBoard() {
    board = [];
    const boardEl = document.getElementById('board');
    boardEl.innerHTML = '';
    boardEl.style.gridTemplateColumns = `repeat(${size}, 32px)`;

    for (let r = 0; r < size; r++) {
        const row = [];
        for (let c = 0; c < size; c++) {
            const cell = {
                r,
                c,
                state: 'empty', // empty, filled, marked
                element: null
            };
            const div = document.createElement('div');
            div.className = 'cell';

            const handler = () => toggleCell(cell);
            div.addEventListener('click', handler);
            div.addEventListener('touchstart', (e) => {
                e.preventDefault();
                handler();
            });

            cell.element = div;
            row.push(cell);
            boardEl.appendChild(div);
        }
        board.push(row);
    }
}

function toggleCell(cell) {
    if (cell.state === 'empty') {
        cell.state = 'filled';
        cell.element.classList.add('filled');
        cell.element.classList.remove('marked');
    } else if (cell.state === 'filled') {
        cell.state = 'marked';
        cell.element.classList.add('marked');
        cell.element.classList.remove('filled');
    } else {
        cell.state = 'empty';
        cell.element.classList.remove('filled', 'marked');
    }
}

document.getElementById('resetBtn').addEventListener('click', createBoard);

createBoard();
</script>

</body>
</html>
