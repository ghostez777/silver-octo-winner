<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
               user-scalable=0, minimal-ui, shrink-to-fit=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Monkey Mart</title>

    <!-- Point this to a Monkey Mart build (HTML5/Defold) -->
    <base href="https://cdn.jsdelivr.net/gh/genizy/monkey-mart-mobile@89836e4c54e87739ace84f6fe801b423185cc51d/" />

    <style>
      body {
        position: fixed;
        margin: 0;
        padding: 0;
        background: #00bb61;
      }
      .canvas-app-container {
        width: 100%;
        height: 100%;
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      #canvas {
        outline: none;
        border: 0;
        width: 100%;
        height: 100%;
        vertical-align: bottom;
      }
      #canvas-container {
        position: relative;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app-container" class="canvas-app-container">
      <div id="canvas-container">
        <canvas id="canvas" tabindex="1" width="960" height="640"></canvas>
      </div>
    </div>

    <!-- Engine loader from the Monkey Mart build -->
    <script src="dmloader.js"></script>
    <script>
      var extra_params = {
        archive_location_filter: function (path) {
          return "archive" + path;
        },
        engine_arguments: ["--verify-graphics-calls=false"],
        custom_heap_size: 134217728,
        full_screen_container: "#canvas-container",
        disable_context_menu: true,
      };

      Module["INITIAL_MEMORY"] = extra_params.custom_heap_size;
      Module["onRuntimeInitialized"] = function () {
        Module.runApp("canvas", extra_params);
      };
      Module["locateFile"] = function (path) {
        if (
          path === "dmengine.wasm" ||
          path === "dmengine_release.wasm" ||
          path === "dmengine_headless.wasm"
        ) {
          return "MonkeyMart.wasm";
        }
        return path;
      };
    </script>
  </body>
</html>
