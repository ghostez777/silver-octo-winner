<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GameHub Ruffle Player</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b12;color:#fff;font-family:system-ui,sans-serif}
#player{width:100vw;height:100vh}
#status{position:fixed;inset:0;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#080b12;z-index:10;text-align:center}
#status.hidden{display:none}.box{max-width:720px;padding:24px;border-radius:16px;background:#111827;border:1px solid #263244}
h1{margin:0 0 10px;font-size:22px}p{margin:8px 0;opacity:.8}code{word-break:break-all}
</style>
<script>
window.RufflePlayer=window.RufflePlayer||{};
window.RufflePlayer.config={publicPath:"./",autoplay:"auto",letterbox:"fullscreen"};
</script>
<script src="./ruffle.js"></script>
</head>
<body>
<div id="status"><div class="box"><h1 id="statusTitle">Loading Flash game…</h1><p id="statusText">Starting Ruffle.</p></div></div>
<div id="player"></div>
<script>
(async function(){
 const status=document.getElementById("status"),title=document.getElementById("statusTitle"),msg=document.getElementById("statusText");
 function fail(message){title.textContent="Ruffle could not load the game";msg.innerHTML=message;status.classList.remove("hidden")}
 try{
  const params=new URLSearchParams(location.search),requested=params.get("game");
  if(!requested){fail("No SWF file was specified.");return}
  const swfUrl=/^https?:\/\//i.test(requested)?requested:new URL("../"+requested.replace(/^\/+/, ""),location.href).href;
  const api=window.RufflePlayer&&window.RufflePlayer.newest?window.RufflePlayer.newest():null;
  if(!api){fail("Ruffle did not initialize. Check that ruffle.js and the WASM files are reachable.");return}
  const player=api.createPlayer();
  player.style.width="100%";player.style.height="100%";
  document.getElementById("player").appendChild(player);
  await player.ruffle().load({url:swfUrl,autoplay:"auto",allowNetworking:"all"});
  status.classList.add("hidden");
 }catch(error){
  console.error(error);
  fail("Could not load the SWF file.<br><br>Check that the file exists and that the site is being served over HTTP/HTTPS.");
 }
})();
</script>
</body>
</html>
