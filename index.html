<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New tab</title>
  <meta name="description" content="Browse and play the Ghostez Arcade collection of browser games and retro classics.">
  <meta name="theme-color" content="#080b12">

  <link rel="stylesheet" href="style.css?v=20260924-3">

  <script>
    // Ruffle's worker and WASM files live beside ruffle.js.
    // Resolve this from the current site URL so both custom domains
    // and GitHub Pages subpaths work.
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      publicPath: new URL("ruffle/", document.baseURI).href,
      autoplay: "auto",
      letterbox: "off",
      allowNetworking: "all",
      allowFullscreen: true
    };
  </script>
</head>

<body>
  <main class="main">
    <header class="topbar">
      <a class="brand" href="#top" aria-label="Ghostez Arcade home">
        <span class="brand-icon">G</span>
        <span>
          <strong>GHOSTEZ</strong>
          <small>ARCADE</small>
        </span>
      </a>

      <label class="search-wrap" for="searchInput">
        <span aria-hidden="true">⌕</span>
        <input
          id="searchInput"
          type="search"
          placeholder="Search games..."
          autocomplete="off"
        >
        <kbd>CTRL K</kbd>
      </label>

      <button id="randomBtn" class="top-button" type="button">🎲 Random</button>
    </header>

    <section id="gamesSection" class="content-section" aria-label="All games">
      <div class="games-toolbar">
        <h1>All Games</h1>
        <span id="gameCount" class="count">Loading games...</span>
      </div>

      <div id="gamesGrid" class="game-grid"></div>
    </section>

    <section id="settingsSection" class="content-section">
      <div class="section-heading">
        <div>
          <span class="section-label">PREFERENCES</span>
          <h2>Settings</h2>
        </div>
      </div>

      <div class="settings-grid">
        <label class="setting-card">
          <span>
            <strong>Animations</strong>
            <small>Enable interface animations</small>
          </span>

          <span class="switch">
            <input type="checkbox" id="animationsToggle" checked>
            <i></i>
          </span>
        </label>

        <label class="setting-card">
          <span>
            <strong>Compact cards</strong>
            <small>Fit more games on screen</small>
          </span>

          <span class="switch">
            <input type="checkbox" id="compactToggle">
            <i></i>
          </span>
        </label>

        <div class="setting-card">
          <span>
            <strong>Reset favorites</strong>
            <small>Remove every saved favorite</small>
          </span>
          <button id="resetFavorites" class="danger-button" type="button">Reset</button>
        </div>
      </div>
    </section>
  </main>

  <div
    id="playerModal"
    class="player-modal"
    role="dialog"
    aria-modal="true"
    aria-label="Game player"
  >
    <div class="player-window" id="playerWindow">
      <div class="player-topbar">
        <strong>
          <span class="player-status"></span>
          <span id="playerTitle">Game</span>
        </strong>

        <div class="player-actions">
          <button id="openNewTab" class="player-button" type="button" title="Open in new tab" aria-label="Open in new tab">↗</button>
          <button id="closePlayer" class="player-button" type="button" title="Close game" aria-label="Close game">✕</button>
        </div>
      </div>

      <iframe
        id="gameFrame"
        src="about:blank"
        title="Game frame"
        allow="fullscreen; autoplay; gamepad"
        allowfullscreen
      ></iframe>

      <div id="ruffleFrame" aria-live="polite"></div>
    </div>
  </div>

  <div id="notesModal" class="small-modal">
    <div class="small-modal-box">
      <button class="modal-close" data-close="notesModal" type="button">✕</button>
      <h2>Notes</h2>
      <textarea id="notesArea" placeholder="Write something..."></textarea>
      <button class="primary-button" id="saveNotes" data-close="notesModal" type="button">Save</button>
    </div>
  </div>

  <div id="timerModal" class="small-modal">
    <div class="small-modal-box">
      <button class="modal-close" data-close="timerModal" type="button">✕</button>
      <h2>Timer</h2>

      <div id="timerDisplay" class="timer-display">05:00</div>

      <div class="timer-controls">
        <button id="timerStart" class="secondary-button" type="button">Start</button>
        <button id="timerReset" class="danger-button" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div id="toast" role="status"></div>

  <script src="reliability.js"></script>
  <script src="ruffle/ruffle.js"></script>
  <script src="script.js?v=20260924-3"></script>
</body>
</html>
