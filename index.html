<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Papa's Games Hub</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Nunito:400,700">

    <style>
        body {
            font-family: Nunito, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        header {
            background: #ff6b6b;
            padding: 20px;
            text-align: center;
            color: white;
            font-size: 28px;
            font-weight: 700;
        }

        #games {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .game {
            background: white;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .game:hover {
            transform: scale(1.05);
        }

        .game img {
            width: 100%;
            border-radius: 10px;
        }

        #player {
            width: 100%;
            height: 600px;
            background: black;
            margin-top: 20px;
        }

        #fullscreenBtn {
            margin: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #fullscreenBtn:hover {
            background: #45a049;
        }
    </style>
</head>

<body>

<header>Papa's Games Hub</header>

<div id="games"></div>

<button id="fullscreenBtn">Fullscreen</button>

<div id="player"></div>

<script src="ruffle/web.ruffle.js"></script>
<script src="script.js"></script>

</body>
</html>
