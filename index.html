<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>EzPzGhostez - Arcade Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <span class="logo-icon">🎮</span>
            <span class="logo-text">EzPz<span class="highlight">Ghostez</span></span>
        </div>

        <div class="search-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input id="search" type="text" placeholder="Search games..." autocomplete="off">
        </div>
    </nav>

    <header class="hero">
        <div class="hero-badge">✨ HTML5 & Flash Arcade</div>
        <h2 class="hero-title">Play Your Favorite Games</h2>
        <p class="hero-subtitle">Retro classics, HTML5 puzzles, and Flash favorites, playable instantly on desktop or mobile.</p>
    </header>

    <main class="container">
        <section id="favorites-section" class="section-container hidden">
            <div class="section-header">
                <h2 class="sectionTitle">⭐ Favorites</h2>
            </div>
            <div id="favorites" class="game-grid"></div>
        </section>

        <section class="section-container">
            <div class="section-header">
                <h2 class="sectionTitle">🎮 All Games</h2>
            </div>
            <div id="games" class="game-grid"></div>
        </section>
    </main>

    <!-- Modal Game Overlay -->
    <div id="player-modal" class="player-modal">
        <div class="player-bar">
            <span id="player-title" class="player-title">Playing Game</span>
            <div class="player-controls">
                <button id="fullscreenBtn" class="control-btn">⛶ Fullscreen</button>
                <button id="closeGameBtn" class="control-btn close-btn">✖ Close</button>
            </div>
        </div>
        <div id="player" class="player-container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle"></script>
    <script src="script.js"></script>
</body>
</html>
