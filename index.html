<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New tab</title>
  <meta name="description" content="ghostez.">
  <meta name="theme-color" content="#080b12">

  <link rel="stylesheet" href="style.css?v=20260924-3">

  <script>
    // Ruffle's worker and WASM files live beside ruffle.js.
    // Resolve this from the current site URL so both custom domains
    // and GitHub Pages subpaths work.
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      publicPath: new URL("ruffle/", document.baseURI).href,
      autoplay: "auto",
      letterbox: "off",
      allowNetworking: "all",
      allowFullscreen: true
    };
  </script>
</head>

<body>
  <main class="main">
    <header class="topbar">
      <a class="brand" href="#top" aria-label="Ghostez home">
        <span class="brand-icon">G</span>
        <span>
          <strong></strong>
          <small></small>
        </span>
      </a>

      <label class="search-wrap" for="searchInput">
        <span aria-hidden="true">⌕</span>
        <input
          id="searchInput"
          type="search"
          placeholder="Search games..."
          autocomplete="off"
        >
        <kbd>CTRL K</kbd>
      </label>

      <button id="randomBtn" class="top-button" type="button">🎲 Random</button>
      <button id="authButton" class="top-button auth-button" type="button">Login</button>
    </header>

    <section id="gamesSection" class="content-section" aria-label="All games">
      <div class="games-toolbar">
        <h1>All Games</h1>
        <span id="gameCount" class="count">Loading games...</span>
      </div>

      <div id="gamesGrid" class="game-grid"></div>
    </section>

    <section id="settingsSection" class="content-section">
      <div class="section-heading">
        <div>
          <span class="section-label">PREFERENCES</span>
          <h2>Settings</h2>
        </div>
      </div>

      <div class="settings-grid">
        <label class="setting-card">
          <span>
            <strong>Animations</strong>
            <small>Enable interface animations</small>
          </span>

          <span class="switch">
            <input type="checkbox" id="animationsToggle" checked>
            <i></i>
          </span>
        </label>

        <label class="setting-card">
          <span>
            <strong>Compact cards</strong>
            <small>Fit more games on screen</small>
          </span>

          <span class="switch">
            <input type="checkbox" id="compactToggle">
            <i></i>
          </span>
        </label>

        <div class="setting-card">
          <span>
            <strong>Reset favorites</strong>
            <small>Remove every saved favorite</small>
          </span>
          <button id="resetFavorites" class="danger-button" type="button">Reset</button>
        </div>
      </div>
    </section>
  </main>

  <div id="authModal" class="auth-modal" aria-hidden="true">
    <div class="auth-box" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <button class="modal-close" type="button" data-close="authModal" aria-label="Close">×</button>
      <div class="auth-heading">
        <span class="section-label">GAMEHUB ACCOUNT</span>
        <h2 id="authTitle">Log in</h2>
        <p id="authStatus">Use your GameHub account to save your session.</p>
      </div>
      <form id="authForm">
        <label class="auth-field">
          <span>Email</span>
          <input id="authEmail" type="email" autocomplete="email" required>
        </label>
        <label class="auth-field">
          <span>Password</span>
          <input id="authPassword" type="password" autocomplete="current-password" minlength="6" required>
        </label>
        <button id="authSubmit" class="top-button" type="submit">Log in</button>
        <button id="authSwitch" class="auth-switch" type="button">Need an account? Sign up</button>
      </form>
      <button id="authLogout" class="top-button" type="button" hidden>Log out</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="lib/cloud-save-manager.js"></script>
  <script src="script.js"></script>
</body>
</html>
