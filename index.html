<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f8f9fb">
    <title>Google Classroom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" aria-label="Sidebar navigation">
            <div class="brand-wrap">
                <div class="brand-mark" aria-hidden="true">◫</div>
                <div>
                    <div class="brand-small">Google</div>
                    <div class="brand-main">Classroom</div>
                </div>
            </div>

            <nav class="side-nav" aria-label="Main menu">
                <a class="nav-item active" href="#library-section">Library</a>
                <a class="nav-item" href="#favorites-section">Favorites</a>
                <a class="nav-item" href="#">Assignments</a>
            </nav>

            <div class="sidebar-card">
                <span class="sidebar-label">Quick access</span>
                <strong>Break time</strong>
                <p>Pick a quick challenge and jump in.</p>
            </div>
        </aside>

        <main class="workspace">
            <header class="topbar">
                <div class="search-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input id="search" type="search" placeholder="Search games" autocomplete="off" aria-label="Search games">
                </div>
                <div class="profile-pill" aria-label="Profile">P</div>
            </header>

            <section class="hero">
                <div class="hero-copy">
                    <span class="eyebrow">Your classroom library</span>
                    <h1>Game time.</h1>
                    <p>Take a break, have fun, and jump into a quick challenge whenever you need one.</p>
                </div>
                <button class="hero-action" type="button">Browse games</button>
            </section>

            <main class="content-panel">
                <section id="favorites-section" class="section-container hidden">
                    <div class="section-header">
                        <div>
                            <span class="section-kicker">Saved</span>
                            <h2 class="sectionTitle">Favorites</h2>
                        </div>
                    </div>
                    <div id="favorites" class="game-grid"></div>
                </section>

                <section id="library-section" class="section-container">
                    <div class="section-header">
                        <div>
                            <span class="section-kicker">Browse everything</span>
                            <h2 class="sectionTitle">All games</h2>
                        </div>
                    </div>
                    <div id="games" class="game-grid"></div>
                </section>
            </main>
        </main>
    </div>

    <div id="player-modal" class="player-modal" role="dialog" aria-modal="true" aria-label="Game player">
        <div class="player-bar">
            <span id="player-title" class="player-title">Playing game</span>
            <div class="player-controls">
                <button id="fullscreenBtn" class="control-btn">⛶ Fullscreen</button>
                <button id="closeGameBtn" class="control-btn close-btn">✕ Close</button>
            </div>
        </div>
        <div id="player" class="player-container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle"></script>
    <script src="script.js"></script>
</body>
</html>
