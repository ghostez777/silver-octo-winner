services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-pokeroguedb}
      MARIADB_USER: ${DB_USER:-pokerogue}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in server/.env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in server/.env}
    volumes:
      - pokerogue-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      addr: "0.0.0.0:8001"
      dbuser: ${DB_USER:-pokerogue}
      dbpass: ${DB_PASSWORD:?Set DB_PASSWORD in server/.env}
      dbproto: "tcp"
      dbaddr: "db:3306"
      dbname: ${DB_NAME:-pokeroguedb}
      gameurl: ${GAME_URL:?Set GAME_URL in server/.env}
      debug: ${DEBUG:-false}
    ports:
      - "8001:8001"

volumes:
  pokerogue-db:
