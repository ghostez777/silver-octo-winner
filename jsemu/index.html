<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameHub Emulator</title>
  <style>
    html, body, #game {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <script>
    /*
      GameHub EmulatorJS launcher.

      ROMs stay in /gba/roms so there is only one ROM folder to maintain.
      Open with:
        /jsemu/?rom=pokemonem.gba

      EmulatorJS supplies the emulator files from its stable CDN.
    */

    const params = new URLSearchParams(window.location.search);
    const rom = params.get("rom") || "pokemonem.gba";

    // Only allow a filename, not an arbitrary URL/path.
    const romName = rom.split("/").pop().split("\\").pop();

    if (!/^[a-zA-Z0-9._-]+\.gba$/i.test(romName)) {
      document.body.innerHTML =
        "<p style='color:white;font-family:sans-serif;padding:20px'>Invalid GBA ROM filename.</p>";
      throw new Error("Invalid GBA ROM filename");
    }

    window.EJS_player = "#game";
    window.EJS_gameName = romName.replace(/\.gba$/i, "");
    window.EJS_biosUrl = "";
    window.EJS_gameUrl = "../gba/roms/" + encodeURIComponent(romName);
    window.EJS_core = "gba";
    window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
    window.EJS_startOnLoaded = true;
    window.EJS_threads = false;
    window.EJS_disableDatabases = true;
    window.EJS_askBeforeExit = false;

    const script = document.createElement("script");
    script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
    script.onload = () => console.log("EmulatorJS loaded:", romName);
    script.onerror = () => {
      document.body.innerHTML =
        "<p style='color:white;font-family:sans-serif;padding:20px'>Could not load EmulatorJS.</p>";
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
